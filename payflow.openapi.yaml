components:
  schemas:
    Customer:
      type: object
      properties:
        id:
          type: string
          description: UUID
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        country:
          type: string
          maxLength: 2
        taxIdType:
          type: string
        taxId:
          type: string
          description: CPF, CNPJ, Passport...
        organization:
          type: object
          properties:
            id:
              type: string
              description: UUID
            taxIdType:
              type: string
            taxId:
              type: string
              description: CPF, CNPJ, ...
          required:
            - id
            - taxIdType
            - taxId
        subscriptions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: UUID
              paymentMethod:
                type: string
              status:
                type: string
                description: status
                enum:
                  - active
                  - canceled
                  - overdue
            required:
              - id
              - paymentMethod
              - status
        invoices:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
                enum:
                  - pending
                  - paid
                  - overdue
                  - canceled
            required:
              - status
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - organization
        - name
        - email
        - taxId
        - createdAt
        - updatedAt
        - country
        - taxIdType
        - subscriptions
        - invoices
    Organization:
      type: object
      properties:
        id:
          type: string
          description: UUID
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        taxIdType:
          type: string
        taxId:
          type: string
          description: CPF, CNPJ, ...
        country:
          type: string
          maxLength: 2
        status:
          type: string
          enum:
            - active
            - inactive
            - suspended
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        customers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: UUID
              taxIdType:
                type: string
              taxId:
                type: string
                description: CPF, CNPJ, Passport...
            required:
              - id
              - taxIdType
              - taxId
          nullable: true
        products:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: UUID
              gateway:
                type: string
              currency:
                type: string
                enum:
                  - BRL
                  - USD
                  - EUR
              paymentMethod:
                type: string
                enum:
                  - pix
                  - boleto
                  - cartao
            required:
              - id
              - gateway
              - currency
              - paymentMethod
        subscriptions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: UUID
              paymentMethod:
                type: string
            required:
              - id
              - paymentMethod
        invoices:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: UUID
            required:
              - id
      required:
        - id
        - name
        - email
        - taxId
        - country
        - status
        - createdAt
        - products
        - subscriptions
        - invoices
        - taxIdType
    Product:
      type: object
      properties:
        id:
          type: string
          description: UUID
        organization:
          type: object
          properties:
            id:
              type: string
              description: UUID
            taxIdType:
              type: string
            taxId:
              type: string
              description: CPF, CNPJ, ...
          required:
            - id
            - taxIdType
            - taxId
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        gateway:
          type: string
        currency:
          type: string
          enum:
            - BRL
            - USD
            - EUR
        paymentMethod:
          type: string
          enum:
            - pix
            - boleto
            - cartao
        billingCycle:
          type: string
          enum:
            - monthly
            - annual
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - organization
        - name
        - description
        - price
        - billingCycle
        - createdAt
        - updatedAt
        - gateway
        - currency
        - paymentMethod
    Subscription:
      type: object
      properties:
        id:
          type: string
          description: UUID
        organization:
          type: object
          properties:
            id:
              type: string
              description: UUID
            taxIdType:
              type: string
            taxId:
              type: string
              description: CPF, CNPJ, ...
          required:
            - id
            - taxIdType
            - taxId
        customer:
          type: object
          properties:
            id:
              type: string
              description: UUID
            country:
