[project]
name = "openapi-contract-fuzzer"
version = "0.1.0"
description = "Contract-guided fuzzing tool for REST APIs based on OpenAPI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Levi Gomes" }
]

dependencies = [
  "pyyaml>=6.0",
  "httpx>=0.25.0",
  "jsonschema>=4.21.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "W"]
