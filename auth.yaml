# Static token — no login request made. Just injects headers as-is.
# Remove or comment `enabled: false` to activate.
auth:
  enabled: false
  inject:
    headers:
      Authorization: "Bearer <TOKEN>"

# Dynamic auth — uncomment and fill to make a login request then inject the token.
# auth:
#   enabled: true
#   request:
#     method: POST
#     url: http://localhost:3000/auth/login
#     headers:
#       Content-Type: application/json
#     body:
#       email: test@example.com
#       password: secret123
#   response:
#     extract:
#       token: ["access_token"]
#   inject:
#     headers:
#       Authorization: "Bearer {token}"
