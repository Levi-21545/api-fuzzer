auth:
  enabled: true

  request:
    method: POST
    url: http://localhost:3000/auth/login
    headers:
      Content-Type: application/json
    body:
      email: test@example.com
      password: secret123

  response:
    extract:
      token: ["access_token"]

  inject: 
    headers:
      Authorization: "Bearer {token}"
  